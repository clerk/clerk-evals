name: Add-auth setup prompt eval

on:
  repository_dispatch:
    types: [clerk_skills_updated, clerk_cli_released]
  workflow_dispatch:
    inputs:
      skills_sha:
        description: Full clerk/skills commit SHA (defaults to current main)
        required: false
        type: string
      cli_version:
        description: Clerk CLI version (must currently be the npm latest version)
        required: false
        type: string
      force:
        description: Run again even if both versioned score artifacts already exist
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

# Serialize the same incoming revision while retaining immutable, versioned artifacts.
concurrency:
  group: add-auth-${{ github.event.client_payload.sha || inputs.skills_sha || 'current' }}-${{ github.event.client_payload.version || inputs.cli_version || 'latest' }}
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sources.outputs.sha }}
      cli: ${{ steps.sources.outputs.cli }}
      skip: ${{ steps.sources.outputs.skip }}
    steps:
      - name: Resolve immutable source versions and duplicate work
        id: sources
        env:
          GH_TOKEN: ${{ github.token }}
          SKILLS_INPUT: ${{ github.event.client_payload.sha || inputs.skills_sha }}
          CLI_INPUT: ${{ github.event.client_payload.version || inputs.cli_version }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          sha="${SKILLS_INPUT:-$(git ls-remote https://github.com/clerk/skills.git refs/heads/main | cut -f1)}"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Expected a full clerk/skills commit SHA' >&2
            exit 1
          fi
          cli="$(npm view clerk version)"
          if [[ -n "$CLI_INPUT" && "$CLI_INPUT" != "$cli" ]]; then
            echo "Requested Clerk CLI $CLI_INPUT is not npm latest ($cli); the canonical prompt uses clerk@latest" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "cli=$cli" >> "$GITHUB_OUTPUT"
          baseline="add-auth-baseline-$sha-$cli"
          skills="add-auth-skills-$sha-$cli"
          comparison="add-auth-comparison-$sha-$cli"
          baseline_exists="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$baseline&per_page=1" --jq '[.artifacts[] | select(.expired == false)] | length')"
          skills_exists="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$skills&per_page=1" --jq '[.artifacts[] | select(.expired == false)] | length')"
          comparison_exists="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$comparison&per_page=1" --jq '[.artifacts[] | select(.expired == false)] | length')"
          if [[ "$FORCE" != 'true' && "$baseline_exists" != '0' && "$skills_exists" != '0' && "$comparison_exists" != '0' ]]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo "Both columns already exist for $sha / $cli; use manual force to rerun"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

  evaluate:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        column: [baseline, skills]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLERK_SKILLS_SHA: ${{ needs.prepare.outputs.sha }}
      CLERK_CLI_VERSION: ${{ needs.prepare.outputs.cli }}
      VERCEL_AI_GATEWAY_API_KEY: ${{ secrets.VERCEL_AI_GATEWAY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'
      - name: Install locked harness dependencies and coding agent
        run: |
          bun install --frozen-lockfile
          npm install --global @anthropic-ai/claude-code
      - name: Check out the exact evaluated Skills revision
        if: matrix.column == 'skills'
        uses: actions/checkout@v4
        with:
          repository: clerk/skills
          ref: ${{ needs.prepare.outputs.sha }}
          path: clerk-skills
          persist-credentials: false
      - name: Verify Skills checkout and CLI version
        env:
          COLUMN: ${{ matrix.column }}
        run: |
          set -euo pipefail
          if [[ "$COLUMN" == 'skills' ]]; then
            test "$(git -C clerk-skills rev-parse HEAD)" = "$CLERK_SKILLS_SHA"
            test -f clerk-skills/skills/clerk-setup/SKILL.md
          fi
          test "$(npm view clerk version)" = "$CLERK_CLI_VERSION"
          test -n "$VERCEL_AI_GATEWAY_API_KEY"
      - name: Run all add-auth variants
        env:
          COLUMN: ${{ matrix.column }}
        run: |
          set -euo pipefail
          if [[ "$COLUMN" == 'skills' ]]; then
            bun agent:claude --eval add-auth --model claude-sonnet-5-5 --skills --skills-path "$GITHUB_WORKSPACE/clerk-skills/skills" --require-complete
          else
            bun agent:claude --eval add-auth --model claude-sonnet-5-5 --require-complete
          fi
          test "$(npm view clerk version)" = "$CLERK_CLI_VERSION"
      - name: Record evaluated source versions
        if: always()
        env:
          COLUMN: ${{ matrix.column }}
        run: |
          jq -n --arg column "$COLUMN" --arg skills_sha "$CLERK_SKILLS_SHA" --arg cli_version "$CLERK_CLI_VERSION" --arg harness_sha "$GITHUB_SHA" --arg model 'claude-sonnet-5-5' \
            '{column: $column, skills_sha: $skills_sha, cli_version: $cli_version, harness_sha: $harness_sha, model: $model}' > source-versions.json
      - name: Upload scores and source versions
        uses: actions/upload-artifact@v4
        with:
          name: add-auth-${{ matrix.column }}-${{ needs.prepare.outputs.sha }}-${{ needs.prepare.outputs.cli }}
          path: |
            agent-scores.json
            source-versions.json
          if-no-files-found: warn
          retention-days: 90
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: add-auth-failed-${{ matrix.column }}-${{ github.run_id }}
          path: source-versions.json
          if-no-files-found: warn
          retention-days: 30

  compare:
    needs: [prepare, evaluate]
    if: needs.evaluate.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'
      - uses: actions/download-artifact@v4
        with:
          name: add-auth-baseline-${{ needs.prepare.outputs.sha }}-${{ needs.prepare.outputs.cli }}
          path: baseline
      - uses: actions/download-artifact@v4
        with:
          name: add-auth-skills-${{ needs.prepare.outputs.sha }}-${{ needs.prepare.outputs.cli }}
          path: skills
      - name: Classify completed eval or regression
        run: bun src/automation/compare-add-auth.ts baseline/agent-scores.json skills/agent-scores.json comparison.json
      - uses: actions/upload-artifact@v4
        with:
          name: add-auth-comparison-${{ needs.prepare.outputs.sha }}-${{ needs.prepare.outputs.cli }}
          path: comparison.json
          retention-days: 90

  notify-automation-failure:
    needs: [prepare, evaluate, compare]
    if: always() && (needs.prepare.result == 'failure' || needs.evaluate.result == 'failure' || needs.evaluate.result == 'cancelled' || needs.compare.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Alert eval automation owner
        env:
          WEBHOOK_URL: ${{ secrets.DOCS_SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ -z "$WEBHOOK_URL" ]]; then
            echo '::error::DOCS_SLACK_WEBHOOK_URL is not configured; automation failure could not be sent to #team-docs'
            exit 1
          fi
          payload="$(jq -n --arg url "$RUN_URL" '{text: "Add-auth eval automation failed or did not complete. Investigate: " + $url}')"
          curl --fail --silent --show-error --max-time 15 -X POST -H 'Content-type: application/json' --data "$payload" "$WEBHOOK_URL"
